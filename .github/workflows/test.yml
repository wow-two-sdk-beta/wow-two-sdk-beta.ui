name: test

# Signal, not gate (beta-forever: fix-forward, releases never blocked).
# Full suite: unit (node) + browser + storybook (Playwright chromium).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest (unit · browser · storybook)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engineering/codebase/wow-two-front-beta-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: engineering/codebase/wow-two-front-beta-sdk/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: engineering/codebase/wow-two-front-beta-sdk/pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # Retry once: the first cold-cache run can hit the vite dep-optimization
      # race (transient `null useState`) — documented in docs/testing.md.
      - name: Test
        run: pnpm test || pnpm test
