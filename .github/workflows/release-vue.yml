name: release-vue

# Vue package release. Mirrors `release.yml` (the React package) but is scoped to
# `engineering/codebase/wow-two-front-vue-beta-sdk/` via the `paths:` filter below, so a
# React-only push never publishes `@wow-two-beta/ui-vue` and vice versa. Tags carry a
# `ui-vue-v` prefix so the two packages' tag namespaces never collide.
on:
  push:
    branches: [main]
    paths:
      - 'engineering/codebase/wow-two-front-vue-beta-sdk/**'
      - '.github/workflows/release-vue.yml'
      - '.github/scripts/vue-release-version*'
  workflow_dispatch:

permissions:
  contents: write   # commit version bump + push tags + create GitHub Releases

concurrency:
  group: release-vue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: validate · bump · publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    defaults:
      run:
        working-directory: engineering/codebase/wow-two-front-vue-beta-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          # version inferred from packageManager field in the nested package.json
          package_json_file: engineering/codebase/wow-two-front-vue-beta-sdk/package.json

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: engineering/codebase/wow-two-front-vue-beta-sdk/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Bump patch version
        id: bump
        run: |
          node --test ../../../.github/scripts/vue-release-version.test.mjs
          VERSION=$(node ../../../.github/scripts/vue-release-version.mjs)
          pnpm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing @wow-two-beta/ui-vue v$VERSION"

      - name: Build
        run: pnpm build

      - name: Playground
        run: pnpm --filter playground build

      - name: Playground browser smoke
        run: node apps/playground/tests/gallery-smoke.mjs

      - name: Packed consumer
        run: pnpm check:package --install --output "$RUNNER_TEMP/ui-vue.tgz"

      # Stop if main changed while this checkout was being verified.
      - name: Verify release source
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"

      # Publish exactly the artifact exercised by the consumer gate.
      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP/ui-vue.tgz" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit + tag version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release ui-vue v${{ steps.bump.outputs.version }} [skip ci]"
          # Never rebase the release after packing: the tag must identify the tested source.
          # If a human advances main, the atomic push fails without moving either ref.
          # A later run selects a patch beyond any already-published npm version.
          git tag -a "ui-vue-v${{ steps.bump.outputs.version }}" -m "ui-vue v${{ steps.bump.outputs.version }}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/ui-vue-v${{ steps.bump.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          TAG="ui-vue-v${VERSION}"

          # Previous ui-vue tag (the one before this just-pushed tag). `--match` keeps the
          # React package's `v*` tags out. Empty on first release.
          PREV=$(git describe --tags --abbrev=0 --match 'ui-vue-v*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            echo "::notice::Changelog range ${RANGE}"
          else
            RANGE="HEAD"
            echo "::notice::First release — using full history"
          fi

          # Collect subjects for commits touching THIS package only ('.' = the package dir,
          # since every step runs with working-directory set to it), skipping the [skip ci]
          # release commit.
          LOG=$(git log "$RANGE" --no-merges --pretty=format:'%s' -- . \
            | grep -vF '[skip ci]' || true)

          section() {
            # $1 = conventional-commit type, $2 = section heading
            local body
            body=$(printf '%s\n' "$LOG" \
              | grep -E "^$1(\(.+\))?!?:" \
              | sed -E "s/^$1(\(.+\))?!?:[[:space:]]*//" \
              | sed -E 's/^/- /' || true)
            if [ -n "$body" ]; then
              printf '### %s\n\n%s\n\n' "$2" "$body"
            fi
          }

          {
            echo "Published \`@wow-two-beta/ui-vue\` v${VERSION} to npm."
            echo
            CHANGELOG=$(
              section 'feat'     'Features'
              section 'fix'      'Fixes'
              section 'perf'     'Performance'
              section 'refactor' 'Refactors'
              section 'docs'     'Docs'
              section 'chore'    'Chores'
            )
            if [ -n "$CHANGELOG" ]; then
              echo "## Changelog"
              echo
              # $(...) strips trailing newlines, so re-add the blank separator.
              printf '%s\n\n' "$CHANGELOG"
            else
              echo "_No conventional-commit changes since ${PREV:-the beginning}._"
              echo
            fi
          } > release-notes.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md
